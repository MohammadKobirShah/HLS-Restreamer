version: "3.8"

services:
  restream:
    build: .
    ports:
      - "8080:8080"
      - "1935:1935"
    environment:
      - SOURCE_URL=https://your-playlist.m3u
      - PORT=8080
      - NGINX_RTMP_PORT=1935
      - HLS_FRAGMENT=10
      - HLS_PLIST_LENGTH=15
      - MAX_CONCURRENT=100
      - CHANNEL_REFRESH=60
    volumes:
      - ./logs:/var/log
      - hls-data:/tmp/hls
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  hls-data:
