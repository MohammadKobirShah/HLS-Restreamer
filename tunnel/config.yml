# ============================================================
# Kobir Shah HLS Restreamer — Cloudflare Named Tunnel Config
# Version: 2.1.0
# Developer: Mohammad Kobir Shah
# GitHub: https://github.com/MohammadKobirShah
#
# ============================================================
# WHEN TO USE THIS FILE
# ============================================================
#
#   This config is for MODE 2: Named Tunnel with credential file.
#   It is an ALTERNATIVE to CF_TUNNEL_TOKEN env var.
#
#   You have TWO ways to authenticate a named tunnel:
#
#   WAY 1 — Token (easier, recommended for Docker):
#     -e CF_TUNNEL_MODE="named"
#     -e CF_TUNNEL_TOKEN="eyJhIjoiYWJj..."
#     → No config.yml needed at all
#
#   WAY 2 — Credential file (this file, for advanced setups):
#     Mount this file + credentials.json into the container
#     → More control, useful for self-hosted / CI environments
#
# ============================================================
# HOW TO GET YOUR VALUES (one-time setup)
# ============================================================
#
#   STEP 1 — Install cloudflared locally (not in Docker):
#     https://developers.cloudflare.com/cloudflared/get-started/
#
#   STEP 2 — Login to Cloudflare:
#     cloudflared tunnel login
#     → Opens browser → select your domain
#     → Downloads cert.pem to ~/.cloudflared/cert.pem
#
#   STEP 3 — Create the tunnel:
#     cloudflared tunnel create hls-relay
#     → Outputs: tunnel ID (UUID format)
#     → Downloads credentials file to:
#          ~/.cloudflared/<TUNNEL_ID>.json
#
#   STEP 4 — Add DNS route:
#     cloudflared tunnel route dns hls-relay stream.yourdomain.com
#     → Creates CNAME: stream.yourdomain.com → <ID>.cfargotunnel.com
#
#   STEP 5 — Copy files into this project:
#     cp ~/.cloudflared/<TUNNEL_ID>.json ./tunnel/credentials.json
#
#   STEP 6 — Fill in the values below, then mount into Docker:
#     -v "$(pwd)/tunnel:/root/tunnel:ro"
#
# ============================================================


# ============================================================
# TUNNEL IDENTITY
# ============================================================

# Your tunnel UUID from: cloudflared tunnel list
# Format: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
tunnel: YOUR-TUNNEL-UUID-HERE

# Path to the credentials JSON file inside the container
# This file is generated by: cloudflared tunnel create <name>
# Mount your local credentials.json to this path
credentials-file: /root/tunnel/credentials.json


# ============================================================
# LOGGING
# ============================================================

# Log verbosity: debug | info | warn | error
loglevel: warn

# Log file path inside container
logfile: /root/logs/cloudflared.log

# Log format: json | text
log-format: text


# ============================================================
# INGRESS RULES
# ============================================================
# Traffic routing: hostname → local service
# Rules are evaluated top to bottom.
# The last rule must always be a catch-all.

ingress:

  # ──────────────────────────────────────────────────────────
  # Rule 1 — Main HLS relay endpoint
  # All traffic to stream.yourdomain.com → local nginx
  # ──────────────────────────────────────────────────────────
  - hostname: stream.yourdomain.com
    service: http://localhost:8080
    originRequest:
      # How long to wait for nginx to respond
      connectTimeout: 10s

      # Total time allowed for a single request
      # Increase for large TS segments on slow connections
      tcpKeepAlive: 30s

      # Disable TLS verification for local http connection
      # (localhost is always plain HTTP internally)
      noTLSVerify: true

      # HTTP/2 to origin (nginx must support it — optional)
      http2Origin: false

      # Pass client's real IP to nginx via header
      # Nginx reads this via: real_ip_header CF-Connecting-IP
      originServerName: ""

      # Keep connections alive to nginx
      keepAliveConnections: 100
      keepAliveTimeout: 90s

      # Disable chunked encoding issues with HLS
      disableChunkedEncoding: false

      # How long cloudflared waits for the first byte
      responseHeaderTimeout: 15s


  # ──────────────────────────────────────────────────────────
  # Rule 2 — Health check subdomain (optional)
  # Useful for uptime monitors (UptimeRobot, BetterUptime etc)
  # Comment out if you only have one hostname
  # ──────────────────────────────────────────────────────────
  # - hostname: health.yourdomain.com
  #   service: http://localhost:8080
  #   path: /health


  # ──────────────────────────────────────────────────────────
  # Rule 3 — Admin / stats subdomain (optional)
  # Restrict stats endpoint to a separate subdomain
  # ──────────────────────────────────────────────────────────
  # - hostname: stats.yourdomain.com
  #   service: http://localhost:8080
  #   path: /stats


  # ──────────────────────────────────────────────────────────
  # Catch-all rule (REQUIRED — must be last)
  # Any unmatched hostname returns 404
  # ──────────────────────────────────────────────────────────
  - service: http_status:404


# ============================================================
# TUNNEL TRANSPORT OPTIONS
# ============================================================

# Number of connections to Cloudflare edge per tunnel
# Cloudflare recommends 4 for production stability
# Reducing saves resources on low-power devices
retries: 5

# Grace period before force-shutdown on SIGTERM
grace-period: 30s

# Metrics server for Prometheus scraping (optional)
# Exposes tunnel metrics at http://localhost:2000/metrics
# Comment out if not using Prometheus
# metrics: localhost:2000


# ============================================================
# EXAMPLE: Full docker run with this config file
# ============================================================
#
#  docker run -d \
#    --name hls-relay \
#    --restart unless-stopped \
#    -p 8080:8080 \
#    -e M3U_URL="https://example.com/playlist.m3u" \
#    -e CF_TUNNEL_MODE="named" \
#    -e PUBLIC_DOMAIN="https://stream.yourdomain.com" \
#    -v "$(pwd)/tunnel:/root/tunnel:ro" \
#    ghcr.io/mohammadkobirshah/hls-restreamer:2.1.0
#
# ============================================================
# EXAMPLE: credentials.json structure (auto-generated, do not edit)
# ============================================================
#
#  {
#    "AccountTag":   "your-cloudflare-account-id",
#    "TunnelSecret": "base64-encoded-secret",
#    "TunnelID":     "same-uuid-as-tunnel-field-above"
#  }
#
# ============================================================
# VERIFY TUNNEL IS WORKING
# ============================================================
#
#  # Inside container — check tunnel status
#  docker exec hls-relay cloudflared tunnel info hls-relay
#
#  # Check tunnel log
#  docker exec hls-relay tail -f /root/logs/cloudflared.log
#
#  # Check tunnel JSON endpoint
#  curl -s https://stream.yourdomain.com/tunnel | python3 -m json.tool
#
#  # List all your tunnels (from your local machine)
#  cloudflared tunnel list
#
# ============================================================
