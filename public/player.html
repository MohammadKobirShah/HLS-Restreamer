<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS Restreamer — Live Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-body: #0a0a12;
            --bg-card: #181825;
            --bg-input: #0f0f1a;
            --bg-elevated: #20203a;
            --border: #2a2a45;
            --border-focus: #00d4ff;
            --text-primary: #f1f1f9;
            --text-secondary: #8888a8;
            --text-muted: #5c5c7a;
            --accent: #00d4ff;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --accent-purple: #a855f7;
            --radius-sm: 8px;
            --radius-md: 12px;
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.6);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .player-wrapper {
            width: 100%;
            max-width: 960px;
        }

        .player-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 12px;
        }

        .player-header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-header h1 i {
            color: var(--accent);
        }

        .player-header .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        select, .input-url {
            padding: 9px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
        }

        select:focus, .input-url:focus {
            outline: none;
            border-color: var(--border-focus);
        }

        .input-url {
            width: 240px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition);
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #0099cc);
            color: #000;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 20px rgba(0,212,255,0.3);
        }

        .btn-ghost {
            background: var(--bg-elevated);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover {
            color: var(--text-primary);
            border-color: var(--text-muted);
        }

        .video-container {
            position: relative;
            background: #000;
        }

        .video-container video {
            width: 100%;
            display: block;
            max-height: 540px;
            background: #000;
        }

        .player-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            gap: 12px;
            background: rgba(0,0,0,0.6);
            transition: opacity var(--transition);
        }

        .player-overlay i {
            font-size: 3rem;
            opacity: 0.4;
        }

        .player-overlay span {
            font-size: 0.9rem;
        }

        .player-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 8px;
        }

        .player-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .player-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .player-status.live .dot {
            background: var(--accent-green);
            box-shadow: 0 0 10px rgba(16,185,129,0.5);
            animation: pulse 1.5s infinite;
        }

        .player-status.error .dot {
            background: var(--accent-red);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color var(--transition);
        }

        .back-link:hover {
            color: var(--accent);
        }

        .player-dev-credit {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 18px 0 6px;
            font-size: 0.75rem;
            position: relative;
        }

        .player-dev-credit::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .player-dev-line {
            color: var(--text-muted);
            opacity: 0.4;
            font-size: 0.6rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 500;
        }

        .player-dev-name {
            font-size: 0.85rem;
            font-weight: 800;
            color: transparent;
            background: linear-gradient(90deg, var(--accent), var(--accent-purple));
            -webkit-background-clip: text;
            background-clip: text;
            text-decoration: none;
            letter-spacing: 0.01em;
            transition: all 0.3s ease;
        }

        .player-dev-name:hover {
            background: linear-gradient(90deg, var(--accent-pink), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
        }

        @media (max-width: 600px) {
            .player-header { flex-direction: column; align-items: stretch; }
            .player-header .controls { flex-direction: column; }
            .input-url { width: 100%; }
            .player-footer { flex-direction: column; align-items: stretch; text-align: center; }
        }
    </style>
</head>
<body>

<div class="player-wrapper">
    <div class="player-card">
        <div class="player-header">
            <h1><i class="fas fa-tv"></i> Live Player</h1>
            <div class="controls">
                <select id="channelSelect">
                    <option value="">Select channel...</option>
                </select>
                <button class="btn btn-primary" onclick="loadSelected()"><i class="fas fa-play"></i> Play</button>
            </div>
        </div>

        <div class="video-container">
            <video id="video" controls autoplay muted playsinline></video>
            <div class="player-overlay" id="overlay">
                <i class="fas fa-play-circle"></i>
                <span>Select a channel to start streaming</span>
            </div>
        </div>

        <div class="player-footer">
            <div class="player-status" id="status">
                <span class="dot"></span>
                <span id="statusText">Ready</span>
            </div>
            <div style="display:flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                <input type="text" class="input-url" id="customUrl" placeholder="Or paste HLS URL...">
                <button class="btn btn-ghost" onclick="loadUrl()"><i class="fas fa-external-link-alt"></i> Load</button>
                <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Admin Panel</a>
            </div>
        <div class="player-dev-credit">
            <span class="player-dev-line">Developed by</span>
            <a href="https://github.com/kobirshah" target="_blank" class="player-dev-name">Kobir Shah</a>
        </div>
    </div>
</div>
</div>

<script>
    const API_URL = '/api';
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    let hls = null;

    document.addEventListener('DOMContentLoaded', loadChannels);

    async function loadChannels() {
        try {
            const res = await fetch(`${API_URL}/channels`);
            const data = await res.json();
            const sel = document.getElementById('channelSelect');
            (data.channels || []).filter(ch => ch.status === 'running').forEach(ch => {
                const opt = document.createElement('option');
                opt.value = `${window.location.origin}/hls/${ch.name}/index.m3u8`;
                opt.textContent = ch.name;
                sel.appendChild(opt);
            });
        } catch {}
    }

    function loadSelected() {
        const val = document.getElementById('channelSelect').value;
        if (val) playStream(val);
    }

    function loadUrl() {
        const val = document.getElementById('customUrl').value.trim();
        if (val) playStream(val);
    }

    function playStream(url) {
        if (hls) { hls.destroy(); hls = null; }
        overlay.style.display = 'none';

        setStatus('Connecting...', '');

        if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.addEventListener('loadedmetadata', () => setStatus('Live', 'live'), { once: true });
            video.addEventListener('error', () => setStatus('Playback error', 'error'), { once: true });
        } else if (window.Hls && Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            setStatus('Buffering...', '');

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play();
                setStatus('Live', 'live');
            });
            hls.on(Hls.Events.ERROR, (e, d) => {
                if (d.fatal) setStatus('Error: ' + d.details, 'error');
            });
        } else {
            setStatus('HLS not supported in this browser', 'error');
        }
    }

    function setStatus(text, type) {
        statusText.textContent = text;
        statusEl.className = 'player-status' + (type ? ' ' + type : '');
    }
</script>
</body>
</html>
