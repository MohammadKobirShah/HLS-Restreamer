# ============================================================
# Kobir Shah HLS Restreamer v2.1.0 — nginx.conf
# Tested clean on Railway / Debian bookworm-slim
#
# ALL ERRORS FIXED:
#
# FIX-1: Removed custom types{} block entirely from http{}.
#        /etc/nginx/mime.types already ships with m3u8 and ts
#        mappings on modern nginx builds. Redefining them causes
#        "duplicate extension" fatal error. We use types_hash
#        and add_header to force correct Content-Type instead.
#
# FIX-2: Moved /status HTML page into a dedicated file
#        /root/hls/status.html served by nginx directly.
#        The inline return 200 '...' approach fails because
#        nginx config parser treats the first ' inside the
#        HTML as end-of-string (line 298 error).
#        start.sh writes the HTML file at startup instead.
#
# FIX-3: Removed aio / directio (unsupported on overlayfs)
# FIX-4: Removed text/html from gzip_types (always included)
# ============================================================

user                 hlsuser hlsgroup;
worker_processes     auto;
worker_rlimit_nofile 65535;

pid        /root/nginx.pid;
error_log  /root/logs/nginx_error.log warn;

events {
    worker_connections  2048;
    use                 epoll;
    multi_accept        on;
}

http {
    # ----------------------------------------------------------
    # FIX-1: Use ONLY the system mime.types file.
    # Do NOT add a custom types{} block — it will duplicate
    # extensions already defined in /etc/nginx/mime.types
    # and cause a fatal "duplicate extension" error.
    # ----------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Increase hash bucket size to avoid hash overflow warnings
    types_hash_max_size     2048;
    types_hash_bucket_size  128;

    # ----------------------------------------------------------
    # Logging
    # ----------------------------------------------------------
    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent rt=$request_time '
                    '"$http_user_agent"';

    access_log  /root/logs/nginx_access.log  main buffer=32k flush=5s;

    # ----------------------------------------------------------
    # Performance
    # ----------------------------------------------------------
    sendfile            on;
    sendfile_max_chunk  512k;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;

    reset_timedout_connection  on;
    client_body_timeout        12;
    send_timeout               12;

    client_body_buffer_size      128k;
    client_max_body_size         1m;
    client_header_buffer_size    1k;
    large_client_header_buffers  4 8k;
    output_buffers               2 32k;

    # ----------------------------------------------------------
    # Compression
    # FIX-4: text/html is ALWAYS compressed by nginx by default.
    #        Adding it to gzip_types causes "duplicate MIME type"
    #        fatal error. Listed types here are extras only.
    # ----------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   4;
    gzip_types
        application/vnd.apple.mpegurl
        audio/mpegurl
        application/json
        text/plain
        text/xml
        text/css
        application/javascript;
    gzip_min_length   256;
    gzip_disable      "msie6";

    # ----------------------------------------------------------
    # Security
    # ----------------------------------------------------------
    server_tokens  off;

    # ----------------------------------------------------------
    # File cache
    # ----------------------------------------------------------
    open_file_cache           max=4096 inactive=30s;
    open_file_cache_valid     60s;
    open_file_cache_min_uses  2;
    open_file_cache_errors    on;

    # ----------------------------------------------------------
    # Rate limiting
    # ----------------------------------------------------------
    limit_req_zone   $binary_remote_addr  zone=playlist:10m  rate=30r/s;
    limit_req_zone   $binary_remote_addr  zone=segment:10m   rate=100r/s;
    limit_conn_zone  $binary_remote_addr  zone=addr:10m;

    # ==========================================================
    # Server
    # ==========================================================
    server {
        listen       8080 default_server reuseport;
        server_name  _;

        root  /root/hls;

        # ------------------------------------------------------
        # Cloudflare real IP
        # ------------------------------------------------------
        set_real_ip_from  103.21.244.0/22;
        set_real_ip_from  103.22.200.0/22;
        set_real_ip_from  103.31.4.0/22;
        set_real_ip_from  104.16.0.0/13;
        set_real_ip_from  104.24.0.0/14;
        set_real_ip_from  108.162.192.0/18;
        set_real_ip_from  131.0.72.0/22;
        set_real_ip_from  141.101.64.0/18;
        set_real_ip_from  162.158.0.0/15;
        set_real_ip_from  172.64.0.0/13;
        set_real_ip_from  173.245.48.0/20;
        set_real_ip_from  188.114.96.0/20;
        set_real_ip_from  190.93.240.0/20;
        set_real_ip_from  197.234.240.0/22;
        set_real_ip_from  198.41.128.0/17;
        real_ip_header     CF-Connecting-IP;
        real_ip_recursive  on;

        # ------------------------------------------------------
        # Global CORS + security headers
        # ------------------------------------------------------
        add_header  Access-Control-Allow-Origin    "*"                              always;
        add_header  Access-Control-Allow-Methods   "GET, HEAD, OPTIONS"             always;
        add_header  Access-Control-Allow-Headers   "Origin, Content-Type, Accept, Range" always;
        add_header  Access-Control-Expose-Headers  "Content-Length, Content-Range"  always;
        add_header  X-Content-Type-Options         "nosniff"                        always;
        add_header  X-Frame-Options                "SAMEORIGIN"                     always;

        # ------------------------------------------------------
        # Block hidden / internal files
        # ------------------------------------------------------
        location ~ /\. {
            deny           all;
            access_log     off;
            log_not_found  off;
        }

        location ~ \.(pid|lock|down_since|restarting|result)$ {
            deny           all;
            access_log     off;
            log_not_found  off;
        }

        # ------------------------------------------------------
        # Default location
        # ------------------------------------------------------
        location / {
            if ($request_method = OPTIONS) {
                add_header  Access-Control-Allow-Origin  "*";
                add_header  Access-Control-Max-Age       1728000;
                add_header  Content-Type                 "text/plain";
                add_header  Content-Length               0;
                return 204;
            }
            autoindex  off;
            try_files  $uri $uri/ =404;
        }

        # ------------------------------------------------------
        # M3U8 playlists
        # Force correct MIME type with add_header + charset.
        # No types{} block needed — mime.types handles m3u8.
        # ------------------------------------------------------
        location ~* \.m3u8$ {
            limit_req   zone=playlist  burst=20  nodelay;
            limit_conn  addr           10;

            add_header  Content-Type                "application/vnd.apple.mpegurl" always;
            add_header  Cache-Control               "no-cache, no-store, must-revalidate" always;
            add_header  Pragma                      "no-cache"                      always;
            add_header  Expires                     "0"                             always;
            add_header  Access-Control-Allow-Origin "*"                             always;

            expires    -1;
            try_files  $uri =404;
        }

        # ------------------------------------------------------
        # TS segments
        # FIX-3: No aio, no directio (unsupported on Railway)
        # ------------------------------------------------------
        location ~* \.ts$ {
            limit_req   zone=segment  burst=50  nodelay;
            limit_conn  addr          20;

            add_header  Content-Type                "video/mp2t"       always;
            add_header  Cache-Control               "public, max-age=8" always;
            add_header  Access-Control-Allow-Origin "*"                 always;

            expires    8s;
            try_files  $uri =404;
        }

        # ------------------------------------------------------
        # Restream playlist (outside root — needs alias)
        # ------------------------------------------------------
        location = /restream_playlist.m3u8 {
            alias  /root/restream_playlist.m3u8;

            limit_req  zone=playlist  burst=10  nodelay;

            add_header  Content-Type                "application/vnd.apple.mpegurl" always;
            add_header  Cache-Control               "no-cache, no-store, must-revalidate" always;
            add_header  Pragma                      "no-cache"                      always;
            add_header  Access-Control-Allow-Origin "*"                             always;

            expires  -1;
        }

        # ------------------------------------------------------
        # Master playlist (inside root = /root/hls/master.m3u8)
        # ------------------------------------------------------
        location = /master.m3u8 {
            limit_req  zone=playlist  burst=10  nodelay;

            add_header  Content-Type                "application/vnd.apple.mpegurl" always;
            add_header  Cache-Control               "no-cache, no-store, must-revalidate" always;
            add_header  Pragma                      "no-cache"                      always;
            add_header  Access-Control-Allow-Origin "*"                             always;

            expires    -1;
            try_files  $uri =404;
        }

        # ------------------------------------------------------
        # Health check
        # ------------------------------------------------------
        location = /health {
            access_log  off;

            add_header  Content-Type                "text/plain" always;
            add_header  Cache-Control               "no-cache"   always;
            add_header  Access-Control-Allow-Origin "*"          always;

            return 200  "OK\n";
        }

        # ------------------------------------------------------
        # Tunnel info JSON
        # ------------------------------------------------------
        location = /tunnel {
            alias  /root/hls/tunnel.json;

            add_header  Content-Type                "application/json" always;
            add_header  Cache-Control               "no-cache"         always;
            add_header  Access-Control-Allow-Origin "*"                always;

            expires  -1;
        }

        # ------------------------------------------------------
        # Stats JSON
        # ------------------------------------------------------
        location = /stats {
            alias  /root/hls/stats.json;

            add_header  Content-Type                "application/json" always;
            add_header  Cache-Control               "no-cache"         always;
            add_header  Access-Control-Allow-Origin "*"                always;

            expires  -1;
        }

        # ------------------------------------------------------
        # FIX-2: Status page served from file, NOT inline HTML.
        # The return 200 '...' approach breaks because nginx
        # config parser sees the first ' in HTML/JS as the
        # closing quote of the return string (line 298 error).
        # start.sh writes /root/hls/status.html at boot instead.
        # ------------------------------------------------------
        location = /status {
            alias  /root/hls/status.html;

            add_header  Content-Type                "text/html; charset=utf-8" always;
            add_header  Cache-Control               "no-cache"                 always;
            add_header  Access-Control-Allow-Origin "*"                        always;

            expires  -1;
        }

        # ------------------------------------------------------
        # Error responses
        # ------------------------------------------------------
        error_page  404  @err404;
        location @err404 {
            add_header  Content-Type  "application/json"  always;
            return 404  "{\"error\":\"not_found\",\"status\":404}\n";
        }

        error_page  500 502 503 504  @err5xx;
        location @err5xx {
            add_header  Content-Type  "application/json"  always;
            return 500  "{\"error\":\"server_error\",\"status\":500}\n";
        }
    }
}
