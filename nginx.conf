# ============================================================
# Nginx Configuration ? Kobir Shah HLS Restreamer
# Designed for: nginx -c /root/nginx.conf -p /root/
# ============================================================

worker_processes    auto;
pid                 /root/nginx.pid;
error_log           /root/logs/nginx_error.log warn;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    # ---------- MIME Types (inline) ----------
    types {
        text/html                                        html htm;
        text/css                                         css;
        text/xml                                         xml;
        application/javascript                           js;
        application/json                                 json;
        application/vnd.apple.mpegurl                    m3u8;
        audio/mpegurl                                    m3u;
        video/mp2t                                       ts;
        video/mp4                                        mp4;
        application/octet-stream                         bin;
        image/png                                        png;
        image/jpeg                                       jpg jpeg;
        image/x-icon                                     ico;
    }
    default_type    application/octet-stream;

    # ---------- Logging ----------
    access_log      /root/logs/nginx_access.log;

    # ---------- Performance ----------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 4;
    gzip_types      application/vnd.apple.mpegurl text/plain application/json;
    gzip_min_length 100;

    server_tokens   off;

    open_file_cache          max=1000 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   off;

    # ============================================================
    server {
        listen      8080;
        server_name _;

        root  /root/hls;

        add_header  Access-Control-Allow-Origin   '*'  always;
        add_header  Access-Control-Allow-Methods  'GET, OPTIONS'  always;
        add_header  Access-Control-Allow-Headers  'Origin, Content-Type, Accept, Range'  always;
        add_header  Access-Control-Expose-Headers  'Content-Length, Content-Range'  always;
        add_header  X-Content-Type-Options  'nosniff'  always;

        location ~ /\. {
            deny all;
            log_not_found off;
        }

        location ~* \.m3u8$ {
            types {
                application/vnd.apple.mpegurl  m3u8;
            }
            default_type  application/vnd.apple.mpegurl;

            add_header  Cache-Control  'no-cache, no-store, must-revalidate'  always;
            add_header  Access-Control-Allow-Origin   '*'  always;
            add_header  Access-Control-Allow-Methods  'GET, OPTIONS'  always;
            add_header  Access-Control-Allow-Headers  'Origin, Content-Type, Accept, Range'  always;
            add_header  X-Content-Type-Options  'nosniff'  always;

            expires  -1;
        }

        location ~* \.ts$ {
            types {
                video/mp2t  ts;
            }
            default_type  video/mp2t;

            add_header  Cache-Control  'public, max-age=300'  always;
            add_header  Access-Control-Allow-Origin   '*'  always;
            add_header  Access-Control-Allow-Methods  'GET, OPTIONS'  always;
            add_header  X-Content-Type-Options  'nosniff'  always;

            expires  5m;
        }

        location = /restream_playlist.m3u8 {
            alias  /root/restream_playlist.m3u8;

            types {
                application/vnd.apple.mpegurl  m3u8;
            }
            default_type  application/vnd.apple.mpegurl;

            add_header  Cache-Control  'no-cache, no-store, must-revalidate'  always;
            add_header  Access-Control-Allow-Origin   '*'  always;
            add_header  Access-Control-Allow-Methods  'GET, OPTIONS'  always;
            add_header  X-Content-Type-Options  'nosniff'  always;

            expires  -1;
        }

        location = /master.m3u8 {
            alias  /root/hls/master.m3u8;

            types {
                application/vnd.apple.mpegurl  m3u8;
            }
            default_type  application/vnd.apple.mpegurl;

            add_header  Cache-Control  'no-cache, no-store, must-revalidate'  always;
            add_header  Access-Control-Allow-Origin   '*'  always;
            add_header  Access-Control-Allow-Methods  'GET, OPTIONS'  always;
            add_header  X-Content-Type-Options  'nosniff'  always;

            expires  -1;
        }

        location = /health {
            add_header  Content-Type  text/plain  always;
            add_header  Access-Control-Allow-Origin  '*'  always;
            return  200  'OK\n';
        }

        location = /status {
            add_header  Content-Type  text/html  always;
            add_header  Access-Control-Allow-Origin  '*'  always;
            return  200  '<!DOCTYPE html>
<html><head><title>Kobir Shah HLS Relay</title>
<style>
  body{font-family:monospace;background:#1a1a2e;color:#eee;padding:40px}
  h1{color:#e94560}h2{color:#0f3460}
  a{color:#16c79a;text-decoration:none}
  a:hover{text-decoration:underline}
  .footer{margin-top:40px;color:#666;font-size:12px}
</style></head><body>
<h1>? Kobir Shah HLS Relay</h1>
<h2>Endpoints</h2>
<p>? <a href="/master.m3u8">Master Playlist</a></p>
<p>? <a href="/restream_playlist.m3u8">Restream Playlist</a></p>
<p>? <a href="/health">Health Check</a></p>
<p class="footer">Developer: Kobir Shah</p>
</body></html>';
        }

        location / {
            autoindex  off;
            try_files  $uri  $uri/  =404;
        }

        error_page  404  /404.html;
        location = /404.html {
            internal;
            add_header  Content-Type  text/plain  always;
            return  404  'Not Found\n';
        }

        error_page  500 502 503 504  /5xx.html;
        location = /5xx.html {
            internal;
            add_header  Content-Type  text/plain  always;
            return  502  'Server Error\n';
        }
    }
}
