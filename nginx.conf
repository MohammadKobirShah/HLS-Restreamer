# ============================================================
# Nginx – Kobir Shah HLS Restreamer v2.1.0
# ============================================================
user                 hlsuser hlsgroup;
worker_processes     auto;
worker_cpu_affinity  auto;
worker_rlimit_nofile 65535;

pid        /root/nginx.pid;
error_log  /root/logs/nginx_error.log warn;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    include      /etc/nginx/mime.types;

    types {
        application/vnd.apple.mpegurl  m3u8;
        audio/mpegurl                  m3u;
        video/mp2t                     ts;
    }

    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent rt=$request_time '
                    '"$http_user_agent"';

    access_log  /root/logs/nginx_access.log  main buffer=32k flush=5s;

    sendfile            on;
    sendfile_max_chunk  512k;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;

    reset_timedout_connection  on;
    client_body_timeout        12;
    send_timeout               12;

    client_body_buffer_size      128k;
    client_max_body_size         1m;
    client_header_buffer_size    1k;
    large_client_header_buffers  4 8k;
    output_buffers               2 32k;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   4;
    gzip_types
        application/vnd.apple.mpegurl
        audio/mpegurl
        application/json
        text/plain
        text/html;
    gzip_min_length   256;
    gzip_disable      "msie6";

    server_tokens  off;

    open_file_cache           max=4096 inactive=30s;
    open_file_cache_valid     60s;
    open_file_cache_min_uses  2;
    open_file_cache_errors    on;

    limit_req_zone   $binary_remote_addr  zone=playlist:10m  rate=30r/s;
    limit_req_zone   $binary_remote_addr  zone=segment:10m   rate=100r/s;
    limit_conn_zone  $binary_remote_addr  zone=addr:10m;

    # --------------------------------------------------------
    # Main server
    # --------------------------------------------------------
    server {
        listen       8080 default_server reuseport;
        server_name  _;

        root  /root/hls;

        # Real IP from Cloudflare
        # Cloudflare's IP ranges – updated periodically
        set_real_ip_from  103.21.244.0/22;
        set_real_ip_from  103.22.200.0/22;
        set_real_ip_from  103.31.4.0/22;
        set_real_ip_from  104.16.0.0/13;
        set_real_ip_from  104.24.0.0/14;
        set_real_ip_from  108.162.192.0/18;
        set_real_ip_from  131.0.72.0/22;
        set_real_ip_from  141.101.64.0/18;
        set_real_ip_from  162.158.0.0/15;
        set_real_ip_from  172.64.0.0/13;
        set_real_ip_from  173.245.48.0/20;
        set_real_ip_from  188.114.96.0/20;
        set_real_ip_from  190.93.240.0/20;
        set_real_ip_from  197.234.240.0/22;
        set_real_ip_from  198.41.128.0/17;
        set_real_ip_from  2400:cb00::/32;
        set_real_ip_from  2606:4700::/32;
        set_real_ip_from  2803:f800::/32;
        set_real_ip_from  2405:b500::/32;
        set_real_ip_from  2405:8100::/32;
        set_real_ip_from  2a06:98c0::/29;
        set_real_ip_from  2c0f:f248::/32;
        real_ip_header     CF-Connecting-IP;
        real_ip_recursive  on;

        add_header  Access-Control-Allow-Origin    '*'                              always;
        add_header  Access-Control-Allow-Methods   'GET, HEAD, OPTIONS'             always;
        add_header  Access-Control-Allow-Headers   'Origin, Content-Type, Accept, Range' always;
        add_header  Access-Control-Expose-Headers  'Content-Length, Content-Range'  always;
        add_header  X-Content-Type-Options         'nosniff'                        always;
        add_header  X-Frame-Options                'SAMEORIGIN'                     always;

        location ~ /\. {
            deny           all;
            access_log     off;
            log_not_found  off;
        }

        location ~ \.(pid|lock|down_since|restarting|result)$ {
            deny           all;
            access_log     off;
            log_not_found  off;
        }

        location / {
            if ($request_method = 'OPTIONS') {
                add_header  Access-Control-Allow-Origin  '*';
                add_header  Access-Control-Max-Age       1728000;
                add_header  Content-Type                 'text/plain charset=UTF-8';
                add_header  Content-Length               0;
                return 204;
            }
            autoindex  off;
            try_files  $uri $uri/ =404;
        }

        location ~* \.m3u8$ {
            limit_req   zone=playlist  burst=20  nodelay;
            limit_conn  addr           10;

            types { application/vnd.apple.mpegurl m3u8; }

            add_header  Cache-Control               'no-cache, no-store, must-revalidate'  always;
            add_header  Pragma                      'no-cache'                              always;
            add_header  Expires                     '0'                                     always;
            add_header  Access-Control-Allow-Origin '*'                                     always;

            expires     -1;
            try_files   $uri =404;
        }

        location ~* \.ts$ {
            limit_req   zone=segment  burst=50  nodelay;
            limit_conn  addr          20;

            types { video/mp2t ts; }

            add_header  Cache-Control               'public, max-age=8'  always;
            add_header  Access-Control-Allow-Origin '*'                  always;

            expires      8s;
            directio     512k;
            output_buffers  2 1m;
            aio          on;

            try_files  $uri =404;
        }

        location = /restream_playlist.m3u8 {
            alias  /root/restream_playlist.m3u8;

            limit_req  zone=playlist  burst=10  nodelay;

            types { application/vnd.apple.mpegurl m3u8; }

            add_header  Cache-Control               'no-cache, no-store, must-revalidate'  always;
            add_header  Pragma                      'no-cache'                              always;
            add_header  Access-Control-Allow-Origin '*'                                     always;

            expires  -1;
        }

        location = /master.m3u8 {
            limit_req  zone=playlist  burst=10  nodelay;

            types { application/vnd.apple.mpegurl m3u8; }

            add_header  Cache-Control               'no-cache, no-store, must-revalidate'  always;
            add_header  Pragma                      'no-cache'                              always;
            add_header  Access-Control-Allow-Origin '*'                                     always;

            expires     -1;
            try_files   $uri =404;
        }

        location = /health {
            access_log  off;

            add_header  Content-Type                'text/plain'  always;
            add_header  Cache-Control               'no-cache'    always;
            add_header  Access-Control-Allow-Origin '*'           always;

            return 200  'OK\n';
        }

        location = /tunnel {
            alias  /root/hls/tunnel.json;

            types { application/json json; }

            add_header  Cache-Control               'no-cache'  always;
            add_header  Access-Control-Allow-Origin '*'         always;

            expires  -1;
        }

        location = /stats {
            alias  /root/hls/stats.json;

            types { application/json json; }

            add_header  Cache-Control               'no-cache'  always;
            add_header  Access-Control-Allow-Origin '*'         always;

            expires  -1;
        }

        location = /status {
            add_header  Content-Type                'text/html; charset=utf-8'  always;
            add_header  Cache-Control               'no-cache'                  always;
            add_header  Access-Control-Allow-Origin '*'                         always;

            return 200 '<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="10">
<title>Kobir Shah – HLS Relay</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Courier New",monospace;background:#080c1a;color:#c9d1d9;padding:30px;min-height:100vh}
  .wrap{max-width:960px;margin:0 auto}
  h1{color:#58a6ff;font-size:1.8em;margin-bottom:4px}
  .sub{color:#6e7681;margin-bottom:28px;font-size:.9em}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:28px}
  .card{background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:16px}
  .card-label{color:#6e7681;font-size:.75em;text-transform:uppercase;letter-spacing:1px}
  .card-value{color:#58a6ff;font-size:1.4em;font-weight:bold;margin-top:4px;word-break:break-all}
  .card-value.green{color:#3fb950}
  .card-value.orange{color:#d29922}
  .links{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
  a.btn{display:inline-block;padding:8px 16px;border-radius:6px;text-decoration:none;font-size:.85em;background:#161b22;border:1px solid #30363d;color:#c9d1d9;transition:border-color .2s,color .2s}
  a.btn:hover{border-color:#58a6ff;color:#58a6ff}
  .tunnel-box{background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:20px;margin-bottom:20px}
  .tunnel-url{color:#3fb950;font-size:1.1em;word-break:break-all;margin-top:8px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3fb950;margin-right:6px;animation:pulse 2s infinite}
  .dot.orange{background:#d29922}
  .dot.red{background:#f85149}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  footer{margin-top:40px;color:#6e7681;font-size:.8em;text-align:center;border-top:1px solid #21262d;padding-top:16px}
  table{width:100%;border-collapse:collapse;margin-top:16px}
  th{text-align:left;color:#6e7681;font-size:.75em;text-transform:uppercase;padding:8px;border-bottom:1px solid #21262d}
  td{padding:8px;border-bottom:1px solid #161b22;font-size:.85em}
  .state-active{color:#3fb950}
  .state-starting{color:#d29922}
  .state-down{color:#f85149}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot" id="hdot"></span>Kobir Shah HLS Relay</h1>
  <p class="sub">Multi-Channel Live Streaming &mdash; Cloudflare Tunnel &mdash; Auto-refreshes every 10s</p>

  <div class="tunnel-box">
    <div class="card-label">&#9729; Cloudflare Tunnel URL</div>
    <div class="tunnel-url" id="tunnel-url">Loading...</div>
    <div style="color:#6e7681;font-size:.8em;margin-top:8px" id="tunnel-type"></div>
  </div>

  <div class="cards">
    <div class="card"><div class="card-label">Total Channels</div><div class="card-value" id="total">--</div></div>
    <div class="card"><div class="card-label">Active</div><div class="card-value green" id="active">--</div></div>
    <div class="card"><div class="card-label">Starting</div><div class="card-value orange" id="starting">--</div></div>
    <div class="card"><div class="card-label">Down</div><div class="card-value" style="color:#f85149" id="down">--</div></div>
    <div class="card"><div class="card-label">Uptime</div><div class="card-value" id="uptime">--</div></div>
  </div>

  <div class="links">
    <a class="btn" href="/master.m3u8">&#127916; Master Playlist</a>
    <a class="btn" href="/restream_playlist.m3u8">&#128257; Restream Playlist</a>
    <a class="btn" href="/stats">&#128202; JSON Stats</a>
    <a class="btn" href="/tunnel">&#9729; Tunnel Info</a>
    <a class="btn" href="/health">&#128154; Health</a>
  </div>

  <table id="ch-table">
    <thead>
      <tr>
        <th>#</th><th>Channel</th><th>State</th><th>Segments</th><th>Audio</th>
      </tr>
    </thead>
    <tbody id="ch-body"><tr><td colspan="5" style="color:#6e7681">Loading...</td></tr></tbody>
  </table>

  <footer>
    <p>Developer: <strong>Kobir Shah</strong> &mdash; HLS Restreamer v2.1.0</p>
    <p style="margin-top:4px">Powered by FFmpeg + Nginx + Cloudflare Tunnel</p>
  </footer>
</div>

<script>
function loadData(){
  fetch("/stats").then(r=>r.json()).then(d=>{
    document.getElementById("total").textContent   = d.total_channels||"--";
    document.getElementById("active").textContent  = d.active||"0";
    document.getElementById("starting").textContent= d.starting||"0";
    document.getElementById("down").textContent    = d.down||"0";
    document.getElementById("uptime").textContent  = d.uptime||"--";

    var tbody = document.getElementById("ch-body");
    tbody.innerHTML = "";
    (d.channels||[]).forEach(function(ch,i){
      var stateClass = "state-"+ch.state;
      var stateSymbol = ch.state==="active"?"●":ch.state==="starting"?"◑":"○";
      tbody.innerHTML += "<tr>"
        +"<td>"+(i+1)+"</td>"
        +"<td>"+ch.name+"</td>"
        +"<td class=\""+stateClass+"\">"+stateSymbol+" "+ch.state+"</td>"
        +"<td>"+ch.segments+"</td>"
        +"<td>"+ch.audio_lang+"</td>"
        +"</tr>";
    });
  }).catch(function(){});

  fetch("/tunnel").then(r=>r.json()).then(d=>{
    var el = document.getElementById("tunnel-url");
    var te = document.getElementById("tunnel-type");
    if(d.url && d.url !== "pending"){
      el.innerHTML = "<a href=\""+d.url+"\" target=\"_blank\" style=\"color:#3fb950\">"+d.url+"</a>";
      te.textContent = "Type: "+d.type+" | Status: "+d.status;
      document.getElementById("hdot").className="dot";
    } else {
      el.textContent = d.status==="starting"?"Tunnel starting – please wait...":"Tunnel not available";
      el.style.color="#d29922";
      document.getElementById("hdot").className="dot orange";
    }
  }).catch(function(){
    document.getElementById("tunnel-url").textContent="Tunnel info unavailable";
  });
}
loadData();
setInterval(loadData, 8000);
</script>
</body>
</html>';
        }

        error_page  404  @err404;
        location @err404 {
            add_header  Content-Type  'application/json'  always;
            return 404  '{"error":"not_found","status":404}\n';
        }

        error_page  500 502 503 504  @err5xx;
        location @err5xx {
            add_header  Content-Type  'application/json'  always;
            return 500  '{"error":"server_error","status":500}\n';
        }
    }
}
