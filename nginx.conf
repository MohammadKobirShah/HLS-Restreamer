# ============================================================
# Nginx Configuration – Kobir Shah HLS Restreamer
# Optimized for: Low latency, high performance
# ============================================================

user                 root;
worker_processes     auto;
worker_cpu_affinity  auto;
worker_rlimit_nofile 65535;

pid        /root/nginx.pid;
error_log  /root/logs/nginx_error.log warn;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    include  /etc/nginx/mime.types;
    
    types {
        application/vnd.apple.mpegurl  m3u8;
        audio/mpegurl                   m3u;
        video/mp2t                      ts;
        video/mp4                       mp4;
    }
    
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log  /root/logs/nginx_access.log  main buffer=32k flush=5s;

    # Performance
    sendfile           on;
    sendfile_max_chunk 512k;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 100;
    
    reset_timedout_connection  on;
    client_body_timeout        10;
    send_timeout               10;
    
    # Buffers
    client_body_buffer_size    128k;
    client_max_body_size       10m;
    client_header_buffer_size  1k;
    large_client_header_buffers 4 8k;
    output_buffers             2 32k;
    postpone_output            1460;

    # Gzip
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   4;
    gzip_types        application/vnd.apple.mpegurl application/json text/plain;
    gzip_min_length   256;
    gzip_disable      "msie6";

    # Security
    server_tokens     off;
    
    # File cache
    open_file_cache           max=2000 inactive=20s;
    open_file_cache_valid     30s;
    open_file_cache_min_uses  2;
    open_file_cache_errors    on;

    # Rate limiting (optional)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ============================================================
    # Main server block
    # ============================================================
    server {
        listen      8080 default_server reuseport;
        server_name _;
        
        root  /root/hls;
        
        # CORS headers
        add_header  Access-Control-Allow-Origin    '*' always;
        add_header  Access-Control-Allow-Methods   'GET, OPTIONS' always;
        add_header  Access-Control-Allow-Headers   'Origin, Content-Type, Accept, Range' always;
        add_header  Access-Control-Expose-Headers  'Content-Length, Content-Range' always;
        add_header  X-Content-Type-Options         'nosniff' always;

        # Security
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # M3U8 playlists (no cache)
        location ~* \.m3u8$ {
            types {
                application/vnd.apple.mpegurl  m3u8;
            }
            
            add_header  Cache-Control              'no-cache, no-store, must-revalidate' always;
            add_header  Pragma                     'no-cache' always;
            add_header  Expires                    '-1' always;
            add_header  Access-Control-Allow-Origin '*' always;
            add_header  X-Content-Type-Options     'nosniff' always;
            
            expires     -1;
        }

        # TS segments (short cache)
        location ~* \.ts$ {
            types {
                video/mp2t  ts;
            }
            
            add_header  Cache-Control              'public, max-age=10' always;
            add_header  Access-Control-Allow-Origin '*' always;
            add_header  X-Content-Type-Options     'nosniff' always;
            
            expires     10s;
            
            # Direct I/O for large files
            directio    512k;
            output_buffers  2 1m;
        }

        # Restream playlist
        location = /restream_playlist.m3u8 {
            alias  /root/restream_playlist.m3u8;
            
            types {
                application/vnd.apple.mpegurl  m3u8;
            }
            
            add_header  Cache-Control              'no-cache' always;
            add_header  Access-Control-Allow-Origin '*' always;
            
            expires  -1;
        }

        # Master playlist
        location = /master.m3u8 {
            alias  /root/hls/master.m3u8;
            
            types {
                application/vnd.apple.mpegurl  m3u8;
            }
            
            add_header  Cache-Control              'no-cache' always;
            add_header  Access-Control-Allow-Origin '*' always;
            
            expires  -1;
        }

        # Health check
        location = /health {
            access_log  off;
            
            add_header  Content-Type               text/plain always;
            add_header  Access-Control-Allow-Origin '*' always;
            
            return 200  'OK\n';
        }

        # Status page
        location = /status {
            add_header  Content-Type  text/html always;
            
            return 200 '<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kobir Shah HLS Relay</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:monospace;background:#0a0e27;color:#e0e0e0;padding:40px;line-height:1.6}
        .container{max-width:800px;margin:0 auto;background:#141b2d;padding:30px;border-radius:10px;box-shadow:0 0 30px rgba(0,255,255,0.1)}
        h1{color:#00d9ff;margin-bottom:10px;font-size:2em;text-shadow:0 0 10px rgba(0,217,255,0.5)}
        h2{color:#ff6b6b;margin:30px 0 15px;font-size:1.3em}
        .subtitle{color:#888;margin-bottom:30px}
        a{color:#00ffa3;text-decoration:none;padding:8px 12px;display:inline-block;background:rgba(0,255,163,0.1);border-radius:5px;margin:5px;transition:all 0.3s}
        a:hover{background:rgba(0,255,163,0.2);transform:translateX(5px)}
        .endpoints{background:#0d1117;padding:20px;border-radius:8px;border-left:4px solid #00d9ff}
        .footer{margin-top:40px;padding-top:20px;border-top:1px solid #333;color:#666;font-size:0.9em;text-align:center}
        .status{display:inline-block;width:10px;height:10px;background:#00ffa3;border-radius:50%;margin-right:8px;animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
    </style>
</head>
<body>
    <div class="container">
        <h1><span class="status"></span>Kobir Shah HLS Relay</h1>
        <p class="subtitle">Multi-Channel Live Streaming Platform</p>
        
        <h2>Available Endpoints</h2>
        <div class="endpoints">
            <a href="/master.m3u8">📺 Master Playlist</a>
            <a href="/restream_playlist.m3u8">🔄 Restream Playlist</a>
            <a href="/health">💚 Health Check</a>
        </div>
        
        <div class="footer">
            <p>Developer: <strong>Kobir Shah</strong></p>
            <p>Optimized for Low Latency & High Performance</p>
        </div>
    </div>
</body>
</html>';
        }

        # Default location
        location / {
            autoindex  off;
            try_files  $uri $uri/ =404;
        }

        # Custom error pages
        error_page  404  /404.html;
        location = /404.html {
            internal;
            add_header  Content-Type  text/plain always;
            return 404  'Not Found\n';
        }

        error_page  500 502 503 504  /5xx.html;
        location = /5xx.html {
            internal;
            add_header  Content-Type  text/plain always;
            return 500  'Server Error\n';
        }
    }
}
