user app;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $time_local "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Server
    server {
        listen 8080;
        server_name _;

        # Root for static files
        root /var/www/html;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # HLS streams
        location /hls/ {
            alias /tmp/hls/;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Type';

            # No caching for live streams
            add_header 'Cache-Control' 'no-cache, no-store, must-revalidate';
            add_header 'Pragma' 'no-cache';
            add_header 'Expires' '0';

            # Types
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
                video/mp4 mp4;
            }
        }

        # Master playlist
        location /master.m3u8 {
            alias /var/www/html/master.m3u8;
            add_header Content-Type 'application/vnd.apple.mpegurl';
            add_header 'Access-Control-Allow-Origin' '*';
        }

        # API endpoints
        location /api/ {
            limit_req zone=api burst=20;
            return 404;
        }
    }
}

# RTMP Server
rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application mylive {
            live on;
            wait_video on;
            wait_key on;

            # HLS Output
            hls on;
            hls_path /tmp/hls;
            hls_fragment 10s;
            hls_playlist_length 15s;
            hls_cleanup on;
            hls_continuous on;
            hls_nested on;

            # No transcoding - pass through
            # Video passthrough
            exec_options on;
        }
    }
}

# Stream TCP (for UDP sources)
stream {
    log_format stream_log '$remote_addr [$time_local] '
                          '$protocol $status $bytes_sent $bytes_received '
                          '$session_time "$upstream_addr"';

    access_log /var/log/nginx/stream.log stream_log;

    server {
        listen 1936;
        proxy_pass stream.local;
    }
}
